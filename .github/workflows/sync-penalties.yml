name: 同步違規廠商裁罰紀錄

on:
  schedule:
    - cron: '30 1 * * 2'   # 每週二 09:30（台灣時間）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '試跑：只檢查，不寫入資料庫'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install @supabase/supabase-js
      - name: 下載食藥署違規廣告資料集
        continue-on-error: true
        run: |
          curl -sSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 600 \
            -A "Mozilla/5.0" -o tfda158.json "https://data.fda.gov.tw/data/opendata/export/158/json" || true
          ls -la tfda158.json || true
          head -c 300 tfda158.json || true
      - name: 同步
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TFDA_FILE: tfda158.json
        run: node scripts/sync-penalties.mjs
