name: 更新台灣禁用／限用成分資料

on:
  schedule:
    # 每週一早上 8:00（台北時間）＝ UTC 前一天 00:00
    # 資料本身是靜態的（你更新 PDF 後才會變動），這裡固定每週重新匯入一次
    # 主要是為了避免 Supabase 資料被意外改動而跟資料檔不一致
    - cron: '0 0 * * 1'
  workflow_dispatch: {} # 手動點「Run workflow」觸發
  push:
    branches: [main]
    paths:
      - 'data/restricted-ingredients-seed.json' # 資料檔一有更新，自動重新匯入 Supabase

jobs:
  seed-restricted-ingredients:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 專案
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝依賴套件
        run: npm install @supabase/supabase-js

      - name: 執行資料匯入腳本
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-restricted-ingredients.mjs
